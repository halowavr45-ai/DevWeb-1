<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Fists — Vox Transmissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8CC85;
      --gold-dark: #8B6914;
      --obsidian: #0A0A0B;
      --obsidian-2: #111115;
      --obsidian-3: #1A1A22;
      --stone: #2A2A35;
      --text-main: #F5EDD5;
      --text-muted: #A89870;
      --border: rgba(201, 168, 76, 0.25);
      --border-bright: rgba(201, 168, 76, 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--obsidian);
      color: var(--text-main);
      font-family: 'Crimson Text', Georgia, serif;
    }

    /* ─── BACKGROUND ─── */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('assets/images/hero-bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 11, 0.83);
    }

    /* ─── NAV ─── */
    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10, 10, 11, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      flex-shrink: 0;
    }

    .nav-brand {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--gold); }

    .nav-profile-btn {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.35);
      padding: 0.3rem 0.75rem 0.3rem 0.3rem;
      text-decoration: none;
      transition: border-color 0.25s, background 0.25s;
      color: #C9A84C;
    }

    .nav-profile-btn:hover {
      border-color: rgba(201, 168, 76, 0.8);
      background: rgba(201, 168, 76, 0.07);
    }

    .nav-profile-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(201,168,76,0.5); }
    .nav-profile-info { display: flex; flex-direction: column; line-height: 1.1; }
    .nav-profile-pseudo { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.1em; color: #E8CC85; }
    .nav-profile-disc { font-family: 'Cinzel', serif; font-size: 0.5rem; letter-spacing: 0.08em; color: #A89870; }

    /* ─── MAIN LAYOUT ─── */
    .chat-layout {
      position: fixed;
      top: 56px;
      left: 0; right: 0; bottom: 0;
      display: flex;
      z-index: 1;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: rgba(10, 10, 11, 0.7);
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .sidebar-title span {
      color: var(--gold);
      display: block;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      margin-top: 0.15rem;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
    }

    .conversation-list::-webkit-scrollbar { width: 4px; }
    .conversation-list::-webkit-scrollbar-track { background: transparent; }
    .conversation-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(201, 168, 76, 0.08);
      transition: background 0.15s;
      position: relative;
    }

    .conv-item:hover { background: rgba(201, 168, 76, 0.04); }

    .conv-item.active {
      background: rgba(201, 168, 76, 0.07);
      border-left: 2px solid var(--gold);
    }

    .conv-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    .conv-info { flex: 1; min-width: 0; }

    .conv-name {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--gold-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .conv-preview {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      margin-top: 0.1rem;
    }

    .conv-unread {
      background: var(--gold);
      color: var(--obsidian);
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .sidebar-empty {
      padding: 2rem 1.25rem;
      text-align: center;
    }

    .sidebar-empty p {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .sidebar-empty a {
      color: var(--gold);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .sidebar-empty a:hover { opacity: 0.7; }

    /* ─── CHAT AREA ─── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Chat header */
    .chat-header {
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-shrink: 0;
      background: rgba(10, 10, 11, 0.5);
    }

    .chat-header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-bright);
      object-fit: cover;
    }

    .chat-header-name {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: var(--gold-light);
      flex: 1;
    }

    .chat-header-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      margin-top: 0.05rem;
    }

    /* Messages */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-group {
      display: flex;
      gap: 0.65rem;
      align-items: flex-end;
    }

    .msg-group.mine { flex-direction: row-reverse; }

    .msg-avatar-small {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .msg-bubble {
      max-width: 100%;
      padding: 0.65rem 1rem;
      background: var(--obsidian-3);
      border: 1px solid var(--border);
      position: relative;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      width: fit-content;
      min-width: fit-content;
      word-break: break-word;
    }

    .msg-group.mine .msg-bubble {
      background: rgba(201, 168, 76, 0.1);
      border-color: rgba(201, 168, 76, 0.3);
      color: var(--gold-light);
    }

    .msg-time {
      font-family: 'Cinzel', serif;
      font-size: 0.5rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: block;
      margin-top: 0.3rem;
      opacity: 0.6;
    }

    .msg-group.mine .msg-time { text-align: right; }

    /* Date separator */
    .date-sep {
      text-align: center;
      position: relative;
      margin: 0.5rem 0;
    }

    .date-sep span {
      font-family: 'Cinzel', serif;
      font-size: 0.52rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--obsidian);
      padding: 0 0.75rem;
      position: relative;
      z-index: 1;
    }

    .date-sep::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: var(--border);
    }

    /* Empty chat */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .chat-empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.25;
    }

    .chat-empty-text {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 2;
    }

    /* Input area */
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-shrink: 0;
      background: rgba(10, 10, 11, 0.5);
    }

    .msg-input {
      flex: 1;
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: 'Crimson Text', serif;
      font-size: 1rem;
      padding: 0.65rem 1rem;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.5;
    }

    .msg-input:focus { border-color: var(--gold); }
    .msg-input::placeholder { color: var(--text-muted); opacity: 0.5; }

    .btn-send {
      padding: 0.65rem 1.25rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s, background 0.3s;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      height: 42px;
    }

    .btn-send::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-100%);
      transition: transform 0.3s;
      z-index: -1;
    }

    .btn-send:hover { color: var(--obsidian); }
    .btn-send:hover::before { transform: translateX(0); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* No conversation selected */
    .no-conv {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .no-conv-glyph {
      font-family: 'Cinzel Decorative', serif;
      font-size: 4rem;
      color: var(--gold);
      opacity: 0.1;
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
    }

    .no-conv-title {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .sidebar { width: 200px; }
      #navbar { padding: 0 1rem; }
      .nav-links { gap: 1rem; }
      .nav-links li:not(:last-child) { display: none; }
      .messages-area { padding: 1rem; }
      .input-area { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <!-- NAV -->
  <nav id="navbar">
    <a class="nav-brand" href="index.html">Imperial Fists</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html#lore">Lore</a></li>
      <li><a href="contacts.html">Brotherhood</a></li>
      <li><a href="messages.html" class="active">Messages</a></li>
      <li><a href="login.html" id="nav-login">Login</a></li>
      <li id="nav-profile-li" style="display:none;">
        <a href="profile.html" class="nav-profile-btn" id="nav-profile-btn">
          <img class="nav-profile-avatar" id="nav-avatar" src="" alt="Avatar">
          <div class="nav-profile-info">
            <span class="nav-profile-pseudo" id="nav-pseudo">—</span>
            <span class="nav-profile-disc" id="nav-disc">#0000</span>
          </div>
        </a>
      </li>
    </ul>
  </nav>

  <!-- CHAT LAYOUT -->
  <div class="chat-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <p class="sidebar-title">
          Vox Network
          <span>Transmissions</span>
        </p>
      </div>
      <div class="conversation-list" id="conv-list">
        <div class="sidebar-empty">
          <p>Loading<br>transmissions...</p>
        </div>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="chat-area" id="chat-area">
      <div class="no-conv" id="no-conv">
        <div class="no-conv-glyph">✦</div>
        <p class="no-conv-title">Select a Brother to transmit</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    const SUPABASE_URL  = 'https://pkgwgrslpmmnmgtwzrpb.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZ3dncnNscG1tbm1ndHd6cnBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjM3NDcsImV4cCI6MjA5NTczOTc0N30.oGAQVRdp52Ay3rhmgOJzVRP24jQU50jtk9HPH38Poyc';
    const { createClient } = window.supabase;
    window._sb = window._sb || createClient(SUPABASE_URL, SUPABASE_ANON);
    const sb = window._sb;

    let currentUser    = null;
    let currentProfile = null;
    let activeConvId   = null; // other user's id
    let realtimeSub    = null;
    let convProfiles   = {}; // cache

    // ─── UTILS ────────────────────────────────────────────────────────────────
    function avatarUrl(profile) {
      return profile?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${profile?.pseudo || profile?.id || 'unknown'}`;
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) return 'Today';
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // ─── NAV INIT ─────────────────────────────────────────────────────────────
    async function initNav(user) {
      const { data: profile } = await sb.from('profiles').select('pseudo,discriminator,avatar_url').eq('id', user.id).maybeSingle();
      currentProfile = profile;
      const pseudo = profile?.pseudo || user.email?.split('@')[0] || '—';
      const disc   = profile?.discriminator || '0000';
      const avatar = profile?.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${pseudo}`;
      document.getElementById('nav-pseudo').textContent = pseudo;
      document.getElementById('nav-disc').textContent   = '#' + disc;
      document.getElementById('nav-avatar').src         = avatar;
      document.getElementById('nav-login').parentElement.style.display = 'none';
      document.getElementById('nav-profile-li').style.display = '';
    }

    // ─── LOAD CONVERSATIONS ───────────────────────────────────────────────────
    async function loadConversations() {
      const list = document.getElementById('conv-list');

      // Get contacts (accepted)
      const { data: contacts } = await sb
        .from('contacts')
        .select('*, requester:requester_id(id,pseudo,discriminator,avatar_url), addressee:addressee_id(id,pseudo,discriminator,avatar_url)')
        .or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`)
        .eq('status', 'accepted');

      if (!contacts || contacts.length === 0) {
        list.innerHTML = `<div class="sidebar-empty"><p>No contacts yet.<br><a href="contacts.html">Find Brothers →</a></p></div>`;
        return;
      }

      // Build profiles map
      contacts.forEach(c => {
        const other = c.requester_id === currentUser.id ? c.addressee : c.requester;
        if (other) convProfiles[other.id] = other;
      });

      // Get last messages for each conversation
      const otherIds = contacts.map(c => c.requester_id === currentUser.id ? c.addressee_id : c.requester_id);

      // For each contact, fetch last message
      const convData = [];
      for (const otherId of otherIds) {
        const { data: msgs } = await sb
          .from('messages')
          .select('id, content, created_at, sender_id, read_at')
          .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`)
          .order('created_at', { ascending: false })
          .limit(1);

        const lastMsg = msgs && msgs.length > 0 ? msgs[0] : null;

        // Unread count
        const { count } = await sb
          .from('messages')
          .select('id', { count: 'exact', head: true })
          .eq('sender_id', otherId)
          .eq('receiver_id', currentUser.id)
          .is('read_at', null);

        convData.push({
          otherId,
          lastMsg,
          unread: count || 0
        });
      }

      // Sort by last message
      convData.sort((a, b) => {
        const ta = a.lastMsg ? new Date(a.lastMsg.created_at) : new Date(0);
        const tb = b.lastMsg ? new Date(b.lastMsg.created_at) : new Date(0);
        return tb - ta;
      });

      list.innerHTML = '';
      convData.forEach(({ otherId, lastMsg, unread }) => {
        const p = convProfiles[otherId];
        if (!p) return;
        const preview = lastMsg
          ? (lastMsg.sender_id === currentUser.id ? '↑ ' : '') + lastMsg.content.slice(0, 40) + (lastMsg.content.length > 40 ? '…' : '')
          : 'No transmission yet';

        const item = document.createElement('div');
        item.className = 'conv-item';
        item.dataset.id = otherId;
        item.innerHTML = `
          <img class="conv-avatar" src="${avatarUrl(p)}" alt="${p.pseudo}">
          <div class="conv-info">
            <span class="conv-name">${p.pseudo || '—'}#${p.discriminator || '0000'}</span>
            <span class="conv-preview">${preview}</span>
          </div>
          ${unread > 0 ? `<span class="conv-unread">${unread}</span>` : ''}
        `;
        item.addEventListener('click', () => openConversation(otherId));
        list.appendChild(item);
      });

      // Auto-open if ?with= param
      const urlParams = new URLSearchParams(window.location.search);
      const withId = urlParams.get('with');
      if (withId && convProfiles[withId]) {
        openConversation(withId);
      }
    }

    // ─── OPEN CONVERSATION ────────────────────────────────────────────────────
    async function openConversation(otherId) {
      activeConvId = otherId;
      const p = convProfiles[otherId];
      if (!p) return;

      // Highlight sidebar
      document.querySelectorAll('.conv-item').forEach(i => {
        i.classList.toggle('active', i.dataset.id === otherId);
      });

      // Remove unread badge
      const activeItem = document.querySelector(`.conv-item[data-id="${otherId}"]`);
      if (activeItem) {
        const badge = activeItem.querySelector('.conv-unread');
        if (badge) badge.remove();
      }

      // Mark messages as read
      await sb.from('messages')
        .update({ read_at: new Date().toISOString() })
        .eq('sender_id', otherId)
        .eq('receiver_id', currentUser.id)
        .is('read_at', null);

      // Render chat area
      const chatArea = document.getElementById('chat-area');
      chatArea.innerHTML = `
        <div class="chat-header">
          <img class="chat-header-avatar" src="${avatarUrl(p)}" alt="${p.pseudo}" id="chat-avatar">
  
            <span class="chat-header-name">${p.pseudo || '—'}<span class="chat-header-sub">#${p.discriminator || '0000'}</span></span>
          </div>
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div class="input-area">
          <textarea class="msg-input" id="msg-input" placeholder="Send a transmission..." rows="1"></textarea>
          <button class="btn-send" id="btn-send">Send</button>
        </div>
      `;

      // Auto-resize textarea
      const textarea = document.getElementById('msg-input');
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      document.getElementById('btn-send').addEventListener('click', sendMessage);

      await fetchMessages(otherId);

      // Realtime subscription
      if (realtimeSub) { sb.removeChannel(realtimeSub); }
      realtimeSub = sb.channel(`messages-${currentUser.id}-${otherId}`)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'messages',
          filter: `receiver_id=eq.${currentUser.id}`
        }, (payload) => {
          if (payload.new.sender_id === otherId) {
            appendMessage(payload.new, false);
            // Mark as read immediately
            sb.from('messages').update({ read_at: new Date().toISOString() }).eq('id', payload.new.id);
          }
        })
        .subscribe();
    }

    // ─── FETCH MESSAGES ───────────────────────────────────────────────────────
    async function fetchMessages(otherId) {
      const area = document.getElementById('messages-area');
      area.innerHTML = '';

      const { data: msgs } = await sb
        .from('messages')
        .select('*')
        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      if (!msgs || msgs.length === 0) {
        area.innerHTML = `<div class="chat-empty"><div class="chat-empty-icon">📯</div><p class="chat-empty-text">No transmissions yet<br>Send the first message</p></div>`;
        return;
      }

      let lastDate = '';
      msgs.forEach(msg => {
        const msgDate = formatDate(msg.created_at);
        if (msgDate !== lastDate) {
          lastDate = msgDate;
          const sep = document.createElement('div');
          sep.className = 'date-sep';
          sep.innerHTML = `<span>${msgDate}</span>`;
          area.appendChild(sep);
        }
        appendMessage(msg, msg.sender_id === currentUser.id);
      });

      area.scrollTop = area.scrollHeight;
    }

    function appendMessage(msg, isMine) {
      const area = document.getElementById('messages-area');
      if (!area) return;

      const otherProfile = convProfiles[activeConvId];
      const myAvatar = currentProfile ? avatarUrl(currentProfile) : `https://api.dicebear.com/7.x/bottts/svg?seed=me`;
      const otherAvatar = avatarUrl(otherProfile);

      // Remove empty state if present
      const emptyEl = area.querySelector('.chat-empty');
      if (emptyEl) emptyEl.remove();

      const group = document.createElement('div');
      group.className = `msg-group${isMine ? ' mine' : ''}`;
      group.innerHTML = `
        <img class="msg-avatar-small" src="${isMine ? myAvatar : otherAvatar}" alt="">
        <div style="max-width:65%">
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <span class="msg-time">${formatTime(msg.created_at)}</span>
        </div>
      `;
      area.appendChild(group);
      area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    // ─── SEND MESSAGE ─────────────────────────────────────────────────────────
    async function sendMessage() {
      if (!activeConvId) return;
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content) return;

      const btn = document.getElementById('btn-send');
      btn.disabled = true;
      input.value = '';
      input.style.height = 'auto';

      const { data, error } = await sb.from('messages').insert({
        sender_id:   currentUser.id,
        receiver_id: activeConvId,
        content:     content,
        read_at:     null
      }).select().single();

      btn.disabled = false;

      if (error) {
        console.error('Send error:', error);
        return;
      }

      appendMessage(data, true);

      // Update preview in sidebar
      const convItem = document.querySelector(`.conv-item[data-id="${activeConvId}"]`);
      if (convItem) {
        const preview = convItem.querySelector('.conv-preview');
        if (preview) preview.textContent = '↑ ' + content.slice(0, 40);
      }
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      currentUser = session.user;
      await initNav(currentUser);
      await loadConversations();
    }

    init();
  })();
  </script>
</body>
