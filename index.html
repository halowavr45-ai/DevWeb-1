<!-- ─── AUTH NAV — à coller juste avant </body> dans index.html ─── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Cache le lien login par défaut, affiché par JS si pas de session */
  #nav-login { display: none; }

  .nav-profile-btn {
    display: none; /* affiché par JS si session */
    align-items: center;
    gap: 0.55rem;
    background: transparent;
    border: 1px solid rgba(201, 168, 76, 0.35);
    padding: 0.3rem 0.75rem 0.3rem 0.3rem;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.25s, background 0.25s;
    color: var(--gold, #C9A84C);
  }

  .nav-profile-btn:hover {
    border-color: rgba(201, 168, 76, 0.8);
    background: rgba(201, 168, 76, 0.07);
  }

  .nav-profile-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(201, 168, 76, 0.5);
    display: block;
    flex-shrink: 0;
  }

  .nav-profile-info {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .nav-profile-pseudo {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: #E8CC85;
    white-space: nowrap;
  }

  .nav-profile-disc {
    font-family: 'Cinzel', serif;
    font-size: 0.52rem;
    letter-spacing: 0.08em;
    color: #A89870;
    white-space: nowrap;
  }
</style>
<script>
(function () {
  const SUPABASE_URL  = 'https://pkgwgrslpmmnmgtwzrpb.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZ3dncnNscG1tbm1ndHd6cnBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjM3NDcsImV4cCI6MjA5NTczOTc0N30.oGAQVRdp52Ay3rhmgOJzVRP24jQU50jtk9HPH38Poyc';
  const { createClient } = window.supabase;
  window._sb = window._sb || createClient(SUPABASE_URL, SUPABASE_ANON);
  const sb = window._sb;

  async function initNav() {
    const { data: { session } } = await sb.auth.getSession();
    const loginLink = document.getElementById('nav-login');

    if (!session) {
      // Pas connecté → afficher le lien Login normal
      if (loginLink) loginLink.style.display = '';
      return;
    }

    const user = session.user;

    // Récupère le profil
    const { data: profile } = await sb
      .from('profiles')
      .select('pseudo, discriminator, avatar_url')
      .eq('id', user.id)
      .maybeSingle();

    const pseudo = profile?.pseudo || user.email?.split('@')[0] || '—';
    const disc   = profile?.discriminator || '0000';
    const avatar = profile?.avatar_url
      || `https://api.dicebear.com/7.x/bottts/svg?seed=${pseudo}`;

    // Crée le bouton profil
    const btn = document.createElement('a');
    btn.href = 'profile.html';
    btn.className = 'nav-profile-btn';
    btn.style.display = 'flex';
    btn.innerHTML = `
      <img class="nav-profile-avatar" src="${avatar}" alt="Avatar">
      <div class="nav-profile-info">
        <span class="nav-profile-pseudo">${pseudo}</span>
        <span class="nav-profile-disc">#${disc}</span>
      </div>
    `;

    // Insère à la place du lien Login
    if (loginLink) {
      loginLink.parentNode.insertBefore(btn, loginLink);
      loginLink.style.display = 'none';
    } else {
      // Fallback : ajoute à la fin de nav-links
      const navLinks = document.getElementById('nav-links');
      if (navLinks) navLinks.appendChild(document.createElement('li')).appendChild(btn);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initNav);
  } else {
    initNav();
  }
})();
</script>
