<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Fists — Accès Frère</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8CC85;
      --gold-dark: #8B6914;
      --obsidian: #0A0A0B;
      --obsidian-2: #111115;
      --obsidian-3: #1A1A22;
      --stone: #2A2A35;
      --text-main: #F5EDD5;
      --text-muted: #A89870;
      --border: rgba(201, 168, 76, 0.25);
      --border-bright: rgba(201, 168, 76, 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--obsidian);
      color: var(--text-main);
      font-family: 'Crimson Text', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201, 168, 76, 0.06) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(201, 168, 76, 0.02) 80px),
        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(201, 168, 76, 0.02) 80px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 2rem;
    }

    .brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .brand-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.4rem;
      color: var(--gold-light);
      letter-spacing: 0.1em;
      text-decoration: none;
      display: block;
      margin-bottom: 0.3rem;
    }

    .brand-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card {
      background: var(--obsidian-3);
      border: 1px solid var(--border);
      padding: 2.5rem;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 2rem;
      width: 4rem;
      height: 3px;
      background: var(--gold);
    }

    .tabs {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    .form { display: none; flex-direction: column; gap: 1.2rem; }
    .form.active { display: flex; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input {
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: 'Crimson Text', serif;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus { border-color: var(--gold); }
    input::placeholder { color: var(--text-muted); opacity: 0.5; }

    .btn {
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s, background 0.3s;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-100%);
      transition: transform 0.3s;
      z-index: -1;
    }

    .btn:hover { color: var(--obsidian); }
    .btn:hover::before { transform: translateX(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--gold);
      background: rgba(201, 168, 76, 0.05);
      display: none;
    }

    .msg.error   { border-color: #c94c4c; background: rgba(201, 76, 76, 0.05); color: #e88585; }
    .msg.success { border-color: #4cc97a; background: rgba(76, 201, 122, 0.05); color: #85e8a8; }
    .msg.show    { display: block; }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 2.5rem;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <div class="brand">
      <a class="brand-title" href="index.html">Imperial Fists</a>
      <div class="divider"></div>
      <p class="brand-sub">Oath of the moment</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tab-login">Login</button>
        <button class="tab" id="tab-register">Register</button>
      </div>

      <div id="msg" class="msg"></div>

      <!-- LOGIN -->
      <form class="form active" id="form-login">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button class="btn" type="submit" id="btn-login">Enter the Legion</button>
      </form>

      <!-- REGISTER -->
      <form class="form" id="form-register">
        <div class="field">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="YourName" required minlength="3" maxlength="20">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" required minlength="6">
        </div>
        <button class="btn" type="submit" id="btn-register">Join the Chapter</button>
      </form>
    </div>

    <a href="index.html" class="back-link">← Return to the site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      const SUPABASE_URL  = 'https://pkgwgrslpmmnmgtwzrpb.supabase.co';
      const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZ3dncnNscG1tbm1ndHd6cnBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjM3NDcsImV4cCI6MjA5NTczOTc0N30.oGAQVRdp52Ay3rhmgOJzVRP24jQU50jtk9HPH38Poyc';
      const { createClient } = window.supabase;
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

      // ─── Rediriger si déjà connecté ────────────────────────────────────────
      supabase.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = 'profile.html';
      });

      // ─── Tabs ───────────────────────────────────────────────────────────────
      document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
      document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));

      function switchTab(tab) {
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register').classList.toggle('active', tab === 'register');
        document.getElementById('form-login').classList.toggle('active', tab === 'login');
        document.getElementById('form-register').classList.toggle('active', tab === 'register');
        hideMsg();
      }

      function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = `msg ${type} show`;
      }

      function hideMsg() {
        document.getElementById('msg').className = 'msg';
      }

      function generateDiscriminator() {
        return String(Math.floor(1000 + Math.random() * 9000));
      }

      // ─── LOGIN ──────────────────────────────────────────────────────────────
      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled    = true;
        btn.textContent = 'Connecting...';

        const { error } = await supabase.auth.signInWithPassword({
          email:    document.getElementById('login-email').value,
          password: document.getElementById('login-password').value,
        });

        if (error) {
          showMsg('Incorrect email or password.', 'error');
          btn.disabled    = false;
          btn.textContent = 'Enter the Legion';
          return;
        }

        // ✅ Session confirmée par signInWithPassword → redirect immédiat
        showMsg('Welcome back, Brother.', 'success');
        // On vérifie que la session est bien en place avant de rediriger
        const waitForSession = async () => {
          const { data } = await supabase.auth.getSession();
          if (data.session) {
            window.location.href = 'profile.html';
          } else {
            // Réessaie toutes les 200ms jusqu'à 5 secondes max
            setTimeout(waitForSession, 200);
          }
        };
        waitForSession();
      });

      // ─── REGISTER ───────────────────────────────────────────────────────────
      document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-register');
        btn.disabled    = true;
        btn.textContent = 'Registering...';

        const pseudo        = document.getElementById('reg-username').value.trim();
        const email         = document.getElementById('reg-email').value;
        const password      = document.getElementById('reg-password').value;
        const discriminator = generateDiscriminator();

        const { data, error } = await supabase.auth.signUp({ email, password });

        if (error) {
          showMsg(error.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Join the Chapter';
          return;
        }

        // Confirmation email activée → data.user peut être null
        if (!data.user) {
          showMsg('Compte créé ! Vérifie ton email pour confirmer.', 'success');
          btn.disabled    = false;
          btn.textContent = 'Join the Chapter';
          return;
        }

        // Création du profil en base
        const { error: profileError } = await supabase.from('profiles').insert({
          id:          data.user.id,
          pseudo,
          discriminator,
          avatar_url:  null,
        });

        if (profileError) {
          showMsg('Account created but profile error: ' + profileError.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Join the Chapter';
          return;
        }

        // ✅ On poll la session jusqu'à ce qu'elle soit disponible
        showMsg(`Welcome ${pseudo}#${discriminator} ! Redirecting...`, 'success');
        const waitForSessionReg = async () => {
          const { data: sessionData } = await supabase.auth.getSession();
          if (sessionData.session) {
            window.location.href = 'profile.html';
          } else {
            setTimeout(waitForSessionReg, 200);
          }
        };
        waitForSessionReg();
      });
    })();
  </script>
</body>
</html>
