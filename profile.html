<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Fists — Profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8CC85;
      --gold-dark: #8B6914;
      --obsidian: #0A0A0B;
      --obsidian-2: #111115;
      --obsidian-3: #1A1A22;
      --text-main: #F5EDD5;
      --text-muted: #A89870;
      --border: rgba(201, 168, 76, 0.25);
      --border-bright: rgba(201, 168, 76, 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--obsidian);
      color: var(--text-main);
      font-family: 'Crimson Text', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201, 168, 76, 0.06) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(201, 168, 76, 0.02) 80px),
        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(201, 168, 76, 0.02) 80px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.2rem;
      color: var(--gold-light);
      text-decoration: none;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0.75rem auto;
    }

    .brand-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card {
      background: var(--obsidian-3);
      border: 1px solid var(--border);
      padding: 2.5rem;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 2rem;
      width: 4rem;
      height: 3px;
      background: var(--gold);
    }

    /* Avatar */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 1rem;
      cursor: pointer;
    }

    .avatar-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-bright);
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.2);
    }

    .avatar-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-transform: uppercase;
      text-align: center;
    }

    .avatar-wrapper:hover .avatar-overlay { opacity: 1; }

    #avatar-input { display: none; }

    .Username-display {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold-light);
    }

    .Username-display span {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 1.2rem; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input {
      background: var(--obsidian-2);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-family: 'Crimson Text', serif;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus { border-color: var(--gold); }
    input:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn {
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s, background 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-100%);
      transition: transform 0.3s;
      z-index: -1;
    }

    .btn:hover { color: var(--obsidian); }
    .btn:hover::before { transform: translateX(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-logout {
      border-color: rgba(201, 76, 76, 0.4);
      color: #c94c4c;
      margin-top: 0.5rem;
    }

    .btn-logout::before { background: #c94c4c; }
    .btn-logout:hover { color: white; }

    .msg {
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--gold);
      background: rgba(201, 168, 76, 0.05);
      display: none;
    }

    .msg.error { border-color: #c94c4c; background: rgba(201, 76, 76, 0.05); color: #e88585; }
    .msg.success { border-color: #4cc97a; background: rgba(76, 201, 122, 0.05); color: #85e8a8; }
    .msg.show { display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    #loading {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      padding: 2rem;
    }

    #loading.error-state {
      color: #e88585;
      letter-spacing: 0.1em;
      font-size: 0.75rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <div class="brand">
      <a class="brand-title" href="index.html">Imperial Fists</a>
      <div class="divider"></div>
      <p class="brand-sub">Battle Honours</p>
    </div>

    <div id="loading">Chargement...</div>

    <div class="card" id="profile-card" style="display:none;">
      <div class="avatar-section">
        <div class="avatar-wrapper" onclick="document.getElementById('avatar-input').click()">
          <img class="avatar-img" id="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="Avatar">
          <div class="avatar-overlay">Change<br>your avatar</div>
        </div>
        <input type="file" id="avatar-input" accept="image/*" onchange="handleAvatarChange(event)">
        <div class="Username-display" id="Username-display">—</div>
      </div>

      <div id="msg" class="msg"></div>

      <form class="form" onsubmit="handleSave(event)">
        <div class="field">
          <label>Username</label>
          <input type="text" id="input-Username" minlength="3" maxlength="20" required>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="input-email" disabled>
        </div>
        <button class="btn" type="submit" id="btn-save">Sauvegarder</button>
        <button class="btn btn-logout" type="button" onclick="handleLogout()">Logout</button>
      </form>
    </div>

    <a href="index.html" class="back-link">← Return to site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ─── DIAGNOSTIC : SDK chargé ? ───────────────────────────────────────────
    if (typeof window.supabase === 'undefined') {
      document.getElementById('loading').classList.add('error-state');
      document.getElementById('loading').innerHTML =
        'Erreur : le SDK Supabase n\'a pas pu être chargé.<br>' +
        '<small style="opacity:0.7">Vérifiez votre connexion internet ou un éventuel bloqueur de pub.</small><br><br>' +
        '<a href="index.html" style="color:var(--gold);font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.2em;">← Retour au site</a>';
      throw new Error('[DIAG] Supabase SDK manquant — window.supabase est undefined');
    }
    console.log('[DIAG] ✅ SDK Supabase chargé');

    // ─── INIT SUPABASE ────────────────────────────────────────────────────────
    const SUPABASE_URL  = 'https://pkgwgrslpmmnmgtwzrpb.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZ3dncnNscG1tbm1ndHd6cnBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjM3NDcsImV4cCI6MjA5NTczOTc0N30.oGAQVRdp52Ay3rhmgOJzVRP24jQU50jtk9HPH38Poyc';
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
    console.log('[DIAG] ✅ Client Supabase créé');

    let currentUser    = null;
    let currentProfile = null;
    let newAvatarFile  = null;

    // ─── HELPERS ──────────────────────────────────────────────────────────────
    function showLoadingError(message) {
      const el = document.getElementById('loading');
      el.style.display = 'block';
      el.classList.add('error-state');
      el.innerHTML = message;
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type} show`;
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    async function init() {
      console.log('[DIAG] init() démarré');

      // 1. Vérification de la session
      let session;
      try {
        console.log('[DIAG] Appel getSession()...');
        const { data, error } = await supabase.auth.getSession();
        console.log('[DIAG] getSession() résultat :', { data, error });

        if (error) throw error;
        session = data.session;
      } catch (err) {
        console.error('[DIAG] ❌ Erreur getSession() :', err);
        showLoadingError(
          'Erreur de connexion à Supabase.<br>' +
          '<small style="opacity:0.7">' + err.message + '</small><br><br>' +
          '<a href="index.html" style="color:var(--gold);font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.2em;">← Retour au site</a>'
        );
        return;
      }

      // 2. Pas de session → redirect login
      if (!session) {
        console.warn('[DIAG] ⚠️ Pas de session active → redirect vers login.html');
        window.location.href = 'login.html';
        return;
      }

      console.log('[DIAG] ✅ Session trouvée pour :', session.user.email);
      currentUser = session.user;

      // 3. Récupération du profil
      let profile;
      try {
        console.log('[DIAG] Appel profiles.select() pour id =', currentUser.id);
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .maybeSingle();

        console.log('[DIAG] profiles.select() résultat :', { data, error });

        if (error) throw error;

        // Pas de ligne profil → profil vide par défaut
        profile = data || {
          id: currentUser.id,
          pseudo: '',
          discriminator: '0000',
          avatar_url: null
        };

        if (!data) {
          console.warn('[DIAG] ⚠️ Aucun profil trouvé en base → profil vide utilisé');
        }
      } catch (err) {
        console.error('[DIAG] ❌ Erreur chargement profil :', err);
        showLoadingError(
          'Impossible de charger votre profil.<br>' +
          '<small style="opacity:0.7">' + err.message + '</small><br><br>' +
          '<a href="index.html" style="color:var(--gold);font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.2em;">← Retour au site</a>'
        );
        return;
      }

      currentProfile = profile;

      // 4. Affichage
      console.log('[DIAG] ✅ Profil chargé :', profile);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('profile-card').style.display = 'block';

      document.getElementById('input-Username').value = profile.pseudo || '';
      document.getElementById('input-email').value    = currentUser.email || '';
      document.getElementById('Username-display').innerHTML =
        `${profile.pseudo || '—'}<span>#${profile.discriminator || '0000'}</span>`;

      document.getElementById('avatar-preview').src = profile.avatar_url
        ? profile.avatar_url
        : `https://api.dicebear.com/7.x/bottts/svg?seed=${profile.pseudo || currentUser.id}`;

      console.log('[DIAG] ✅ Page profil affichée avec succès');
    }

    // ─── AVATAR ───────────────────────────────────────────────────────────────
    function handleAvatarChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      newAvatarFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('avatar-preview').src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ─── SAVE ─────────────────────────────────────────────────────────────────
    async function handleSave(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.disabled    = true;
      btn.textContent = 'Sauvegarde...';

      const pseudo     = document.getElementById('input-Username').value.trim();
      let   avatar_url = currentProfile.avatar_url;

      // Upload avatar si changé
      if (newAvatarFile) {
        const ext  = newAvatarFile.name.split('.').pop();
        const path = `avatars/${currentUser.id}.${ext}`;
        console.log('[DIAG] Upload avatar vers :', path);

        const { error: uploadError } = await supabase.storage
          .from('avatars')
          .upload(path, newAvatarFile, { upsert: true });

        if (uploadError) {
          console.error('[DIAG] ❌ Erreur upload avatar :', uploadError);
          showMsg('Erreur upload avatar : ' + uploadError.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Sauvegarder';
          return;
        }

        const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(path);
        avatar_url    = urlData.publicUrl;
        newAvatarFile = null;
        console.log('[DIAG] ✅ Avatar uploadé, URL :', avatar_url);
      }

      // Mise à jour du profil
      console.log('[DIAG] Update profil :', { pseudo, avatar_url });
      const { error } = await supabase
        .from('profiles')
        .update({ pseudo, avatar_url })
        .eq('id', currentUser.id);

      if (error) {
        console.error('[DIAG] ❌ Erreur update profil :', error);
        showMsg('Erreur : ' + error.message, 'error');
      } else {
        currentProfile.pseudo     = pseudo;
        currentProfile.avatar_url = avatar_url;
        document.getElementById('Username-display').innerHTML =
          `${pseudo}<span>#${currentProfile.discriminator || '0000'}</span>`;
        showMsg('Profil mis à jour, Frère.', 'success');
        console.log('[DIAG] ✅ Profil sauvegardé');
      }

      btn.disabled    = false;
      btn.textContent = 'Sauvegarder';
    }

    // ─── LOGOUT ───────────────────────────────────────────────────────────────
    async function handleLogout() {
      console.log('[DIAG] Logout...');
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    }

    // ─── LANCEMENT ────────────────────────────────────────────────────────────
    init().catch(err => {
      console.error('[DIAG] ❌ Erreur non catchée dans init() :', err);
      showLoadingError(
        'Une erreur inattendue est survenue.<br>' +
        '<small style="opacity:0.7">' + err.message + '</small><br><br>' +
        '<a href="index.html" style="color:var(--gold);font-family:Cinzel,serif;font-size:0.6rem;letter-spacing:0.2em;">← Retour au site</a>'
      );
    });
  </script>
</body>
</html>
